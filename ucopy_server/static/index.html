<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>UCopy Server</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font: 14px -apple-system, BlinkMacSystemFont, sans-serif; margin: 40px; max-width: 960px; }
h1 { font-size: 22px; }
.box { padding: 16px; margin: 16px 0; border: 1px solid #ddd; border-radius: 8px; }
code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; }
.ok { color: #2c8a4f; }
.err { color: #b00; }
.muted { color: #888; font-size: 12px; }
button { padding: 6px 14px; margin: 4px; }
input { padding: 4px 8px; font-size: 14px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 10px; border-bottom: 1px solid #eee; text-align: left; }
</style>
</head>
<body>
<h1>UCopy Server <span class="muted" id="server-info"></span></h1>

<div id="login-box" class="box">
  <h2>登录</h2>
  <div>
    <label>用户名：<input id="login-username" value="admin"></label>
    <label>密码：<input id="login-password" type="password"></label>
    <button onclick="login()">登录</button>
  </div>
  <div id="login-msg" class="muted"></div>
</div>

<div id="main" style="display:none">
  <div class="box">
    <h2>当前用户</h2>
    <div id="me"></div>
    <button onclick="logout()">退出</button>
  </div>

  <div class="box" id="admin-box" style="display:none">
    <h2>用户管理（admin）</h2>
    <div id="users"></div>
    <h3>新增用户</h3>
    <label>用户名：<input id="new-username"></label>
    <label>密码：<input id="new-password" type="password"></label>
    <label>角色：
      <select id="new-role">
        <option value="user">user</option>
        <option value="readonly">readonly</option>
        <option value="admin">admin</option>
      </select>
    </label>
    <label>配额(MB, 0=不限)：<input id="new-quota" value="10240" type="number" min="0"></label>
    <button onclick="createUser()">创建</button>
    <div id="users-msg" class="muted"></div>
  </div>

  <div class="box">
    <h2>launchd 自启动</h2>
    <div id="launchd"></div>
    <button onclick="installLaunchd()" id="btn-install">安装</button>
    <button onclick="uninstallLaunchd()" id="btn-uninstall">卸载</button>
  </div>

  <div class="box">
    <h2>文件浏览</h2>
    <div id="path-nav" class="muted"></div>
    <table id="files"></table>
  </div>

  <div class="box">
    <h2>配置同步</h2>
    <div>当前版本：<span id="cfg-version">-</span></div>
    <div>最后修改：<span id="cfg-mtime">-</span></div>
    <div>
      <button onclick="loadConfig()">从服务器拉取</button>
      <button onclick="saveConfig()">推送到服务器</button>
    </div>
    <textarea id="cfg-text" style="width:100%;height:200px;font-family:monospace"></textarea>
    <div id="cfg-msg" class="muted"></div>
  </div>
</div>

<script>
let currentPath = "";
let sessionOk = false;

// ---- helpers ----
async function api(method, path, body) {
  const opts = { method, credentials: 'same-origin', headers: {'X-UCopy-Protocol': '1'} };
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  let data;
  try { data = await r.json(); } catch (e) { data = { ok: false, error: 'non-JSON' }; }
  if (!r.ok && !data.code) data.code = 'http_' + r.status;
  return data;
}

// ---- login / me ----
async function login() {
  const u = document.getElementById('login-username').value;
  const p = document.getElementById('login-password').value;
  const data = await api('POST', '/api/v1/login', { username: u, password: p });
  if (data.ok) {
    document.getElementById('login-msg').innerHTML = '<span class="ok">登录成功</span>';
    await me();
  } else {
    document.getElementById('login-msg').innerHTML = '<span class="err">登录失败：' + data.error + '</span>';
  }
}

async function logout() {
  await api('POST', '/api/v1/logout');
  location.reload();
}

async function me() {
  const data = await api('GET', '/api/v1/me');
  if (data.ok) {
    sessionOk = true;
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('main').style.display = '';
    let used_mb = (data.used_bytes / 1048576).toFixed(2);
    let quota_mb = data.quota_mb;
    let quota_str = quota_mb === 0 ? '不限' : (quota_mb + ' MB');
    document.getElementById('me').innerHTML =
      '用户：<b>' + data.username + '</b> · 角色：<b>' + data.role + '</b> · 已用 <b>' + used_mb + ' MB</b> / 配额 <b>' + quota_str + '</b>';
    if (data.role === 'admin') {
      document.getElementById('admin-box').style.display = '';
      loadUsers();
    }
    loadLaunchd();
    loadFiles();
    loadConfig();
  } else {
    document.getElementById('login-box').style.display = '';
    document.getElementById('main').style.display = 'none';
  }
}

// ---- users ----
async function loadUsers() {
  const data = await api('GET', '/api/v1/admin/users');
  if (!data.ok) {
    document.getElementById('users').innerHTML = '<span class="err">' + data.error + '</span>';
    return;
  }
  let html = '<table><tr><th>用户</th><th>角色</th><th>配额(MB)</th><th>已用</th><th>操作</th></tr>';
  for (const u of data.users) {
    let used_mb = (u.used_bytes / 1048576).toFixed(2);
    let quota_str = u.quota_mb === 0 ? '不限' : u.quota_mb;
    html += '<tr><td>' + u.username + '</td><td>' + u.role + '</td><td>' + quota_str + '</td><td>' + used_mb + ' MB</td>';
    html += '<td><button onclick="deleteUser(\'' + u.username + '\')">删除</button></td></tr>';
  }
  html += '</table>';
  document.getElementById('users').innerHTML = html;
}

async function createUser() {
  const username = document.getElementById('new-username').value;
  const password = document.getElementById('new-password').value;
  const role = document.getElementById('new-role').value;
  const quota_mb = parseInt(document.getElementById('new-quota').value, 10);
  const data = await api('POST', '/api/v1/admin/users', { username, password, role, quota_mb });
  document.getElementById('users-msg').innerHTML = data.ok ?
    '<span class="ok">已创建</span>' : '<span class="err">' + data.error + '</span>';
  if (data.ok) loadUsers();
}

async function deleteUser(username) {
  if (!confirm('确认删除用户 ' + username + '（同时删除其所有文件）？')) return;
  const data = await api('DELETE', '/api/v1/admin/users/' + username);
  document.getElementById('users-msg').innerHTML = data.ok ?
    '<span class="ok">已删除</span>' : '<span class="err">' + data.error + '</span>';
  if (data.ok) loadUsers();
}

// ---- launchd ----
async function loadLaunchd() {
  const data = await api('GET', '/api/v1/launchd');
  if (!data.ok) return;
  document.getElementById('launchd').innerHTML =
    '平台：<b>' + data.platform + '</b> · plist：<code>' + data.plist_path + '</code><br>' +
    '状态：<b>' + data.status + '</b>';
  document.getElementById('btn-install').disabled = data.installed;
  document.getElementById('btn-uninstall').disabled = !data.installed;
}
async function installLaunchd() {
  const data = await api('POST', '/api/v1/launchd/install');
  document.getElementById('launchd').innerHTML += '<br>' +
    (data.ok ? '<span class="ok">已安装</span>' : '<span class="err">' + data.error + '</span>');
  loadLaunchd();
}
async function uninstallLaunchd() {
  const data = await api('POST', '/api/v1/launchd/uninstall');
  document.getElementById('launchd').innerHTML += '<br>' +
    (data.ok ? '<span class="ok">已卸载</span>' : '<span class="err">' + data.error + '</span>');
  loadLaunchd();
}

// ---- files ----
async function loadFiles() {
  const data = await api('GET', '/api/v1/files?path=' + encodeURIComponent(currentPath));
  if (!data.ok) return;
  let html = '<tr><th>名称</th><th>大小</th><th>sha256</th><th>操作</th></tr>';
  if (currentPath) {
    html += '<tr><td colspan="4"><a href="#" onclick="cd(\\\'\\\')">.. (返回根)</a></td></tr>';
  }
  for (const e of data.entries) {
    if (e.type === 'dir') {
      html += '<tr><td><a href="#" onclick="cd(\\'' + (currentPath ? currentPath + '/' : '') + e.name + '\\')"><b>' + e.name + '/</b></a></td><td>-</td><td>-</td><td></td></tr>';
    } else {
      html += '<tr><td>' + e.name + '</td><td>' + e.size + ' B</td><td><code>' + (e.sha256 || '').slice(0, 12) + '…</code></td>';
      html += '<td><a href="/api/v1/files/download?path=' + encodeURIComponent((currentPath ? currentPath + '/' : '') + e.name) + '">下载</a></td></tr>';
    }
  }
  document.getElementById('files').innerHTML = html;
  document.getElementById('path-nav').innerText = '当前路径：/' + currentPath;
}
function cd(p) { currentPath = p; loadFiles(); }

// ---- config ----
async function loadConfig() {
  const data = await api('GET', '/api/v1/config');
  if (data.ok) {
    document.getElementById('cfg-version').innerText = data.version || 0;
    document.getElementById('cfg-mtime').innerText = data.last_modified || '';
    document.getElementById('cfg-text').value = JSON.stringify(data.config, null, 2);
  }
}
async function saveConfig() {
  let cfg;
  try { cfg = JSON.parse(document.getElementById('cfg-text').value); }
  catch (e) { document.getElementById('cfg-msg').innerText = 'JSON 解析失败: ' + e.message; return; }
  const data = await api('PUT', '/api/v1/config', { config: cfg });
  document.getElementById('cfg-msg').innerHTML = data.ok ?
    '<span class="ok">已保存（version ' + data.version + '）</span>' :
    '<span class="err">' + data.error + '</span>';
  if (data.ok) loadConfig();
}

// ---- init ----
fetch('/api/v1/me', { credentials: 'same-origin' })
  .then(r => r.json())
  .then(d => { if (d.ok) me(); });

document.getElementById('server-info').innerText =
  '· ' + location.host;
</script>
</body>
</html>
